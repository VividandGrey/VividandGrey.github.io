<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VividAndGrey</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hubballi&family=Oranienbaum&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="Favicon.png">
</head>
<body>

  <main class="landing-container">
    <div class="content-area">
      
      <!-- Text lines: You can reorder these blocks as needed -->
      <div class="text-group">
        
        <!-- Instagram Link (Add your handle and correct image filename below) -->
        <a href="https://instagram.com/art.ishita" target="_blank" class="instagram-link">
          <img src="insta-logo.png" alt="Instagram" class="instagram-logo">
        </a>
        
        <!-- Line 1: VIVIDANDGREY -->
        <div class="text-line line-vivid-grey">VIVID<span class="color-medium-grey">AND</span>GREY</div>
        
        <!-- Line 2: BY ISHITA NAGER (Biggest size) -->
        <div class="text-line line-author">BY ISHITA NAGER</div>
        
        <!-- Line 3: 'the light that remembers' -->
        <div class="text-line line-tagline">'the light that remembers'</div>
        
        <!-- Line 4: FINE ART COLLECTION COMING SOON -->
        <div class="text-line line-status">FINE ART COLLECTION COMING SOON</div>
        
      </div>

      <!-- Form (aligned directly below the text) -->
      <form class="waitlist-form" action="https://formspree.io/f/maewlnjq" method="POST">
        <!-- Be sure to replace the value with YOUR actual github thanks.html URL -->
        <input type="hidden" name="_next" value="https://github.com/VividandGrey/VividandGrey.github.io/blob/main/thanks.html">
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
          class="email-input"
        />
        <button type="submit" class="submit-button">I'm interested</button>
      </form>

    </div>
  </main>

</body>
</html>
